[project]
name = "agentic-harness-engineering"
version = "0.1.0"
description = "Agentic Harness Engineering"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Curry09" },
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "e2b>=1.0.0",
    "nexau @ git+https://github.com/hzhua/nexau.git@28511d9f0362191a6c378fd441b2be55309a9e32",
    "harbor @ git+https://github.com/Curry09/harbor-LJH.git@88f855f9babfe40d05ae322c166aa27751930694",
    "agent_debugger_core",
]

[project.scripts]
agentic-harness-engineering = "evolve:main"

[tool.uv]
constraint-dependencies = [
    "claude-agent-sdk<0.1.49",
    # NexAU uses Transformers 4, which requires huggingface-hub < 1.
    "huggingface-hub<1",
]

[tool.uv.sources]
agent_debugger_core = { path = "agents/evolve_agent/skills/agent-debugger-cli/_source" }

[tool.setuptools]
py-modules = ["evolve"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["*.j2"]
